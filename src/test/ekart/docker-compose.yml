version: '3.8'

services:
  # PHP Apache Web Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekart-web
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=my_db
      - DB_USER=root
      - DB_PASS=root_password
      - JWT_SECRET=your-secret-key-change-in-production-2026
    depends_on:
      - db
    networks:
      - ekart-network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ekart-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=my_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ekart-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql-data:
    driver: local

networks:
  ekart-network:
    driver: bridge
