services:
  # PHP Service
  php:
    image: php:8.3-fpm
    container_name: php-app
    command: sh -c "docker-php-ext-install pdo_mysql && php-fpm"
    volumes:
      # Maps your code folder
      - C:/phpapps/src:/var/www/html
    networks:
      - lemp-network

  # Nginx Service
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-server
    ports:
      - "8090:80"
    volumes:
      - C:/phpapps/src:/var/www/html
      - C:/phpapps/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - lemp-network

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: my_db
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      # Maps your database data to your Windows drive
      - C:/phpapps/mysql_data:/var/lib/mysql
    networks:
      - lemp-network

networks:
  lemp-network:
    driver: bridge